        revenuecat:
          '<svg class="link-icon link-icon--revenuecat" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M4.3036.3999c-1.5246 0-3.2129.1508-4.303.4136v14.9997c.3083.1722.8432.28 1.5632.28.7404 0 1.2553-.1072 1.5433-.28v-5.2323a14.8588 14.8588 0 0 0 2.121.1512h.3294l2.8604 5.0588c.432.195 1.0288.3024 1.9348.3024.8033 0 1.38-.1104 1.6476-.3024l-3.437-5.8358c1.4195-.8004 2.326-2.2698 2.326-4.4964C10.8894 1.827 8.4232.4 4.3037.4zm15.4543 0c-1.3788 0-2.624.2707-3.6901.7945-2.4552 1.203-3.9609 3.7376-3.9609 7.3627 0 4.8245 2.6552 7.7155 7.1659 7.7155.9 0 1.5868-.3014 2.005.2554.4194.5568-.3582 1.2165-.7746 1.5105-1.6338 1.1544-5.7217-.1024-9.4908-.4804C5.5994 17.015.9264 16.3009.146 19.1928c-.4104 1.5264.1225 2.5013.6421 3.0503 1.044 1.1046 2.882 1.357 4.344 1.357a13.959 13.959 0 0 0 2.0508-.1558 1.311 1.311 0 0 0 1.023-.8063c.1674-.4254.0861-.904-.212-1.2562a1.3464 1.3464 0 0 0-1.2352-.4523c-1.5012.2706-3.6213.8685-4.4343.0105-.2748-.291-.2268-1.0037 0-1.2257.6048-.8748 4.493-.5393 8.4127-.0293 4.329.4344 8.4023 1.8609 10.945.6351.9955-.48 2.318-1.1941 2.318-3.792h-.0012c0-1.1473-.1489-2.274-.4476-3.3797-1.3818.1872-2.4783.2857-3.2883.2941-2.845 0-4.869-1.4484-4.869-5.0963 0-3.648 2.0461-5.1573 5.0179-5.1573 1.2011 0 2.129.2512 3.1405.7336.1062-.9234-.1058-2.1605-.5906-2.8523-.78-.4608-2.0014-.6703-3.2038-.6703zM4.51 3.1889c2.0579 0 3.2108.7111 3.2108 2.4421 0 1.6824-1.0912 2.3554-2.8816 2.3554a10.2838 10.2838 0 0 1-1.7706-.1511V3.3166a7.7782 7.7782 0 0 1 1.4413-.1277z"/></svg>',
      });

      /** Links column: external/app links from apps.json `links` (`[{ label, url, icon? }]`). */
      function linksCell(app) {
        const items = Array.isArray(app?.links) ? app.links : [];
        const parts = items
          .map((item) => {
            if (!item || typeof item !== "object") return "";
            const rawUrl = typeof item.url === "string" ? item.url.trim() : "";
            if (!rawUrl) return "";
            const isExternal = /^https?:\/\//i.test(rawUrl);
            const href = isExternal ? rawUrl : toUrlPath(rawUrl);
            if (!href) return "";
            const label =
              typeof item.label === "string" && item.label.trim()
                ? item.label.trim()
                : "Open";
            const icon = LINK_ICON_SVG[item.icon] || "";
            const extAttr = isExternal
              ? ' target="_blank" rel="noopener noreferrer"'
              : "";
            return `<a class="link-with-icon" href="${esc(href)}"${extAttr}>${icon}<span>${esc(label)}</span></a>`;
          })
          .filter(Boolean);
        const inner = parts.length
          ? `<div class="link-stack conversation-links"><div class="conversation-link-row">${parts.join("")}</div></div>`
          : `<span class="dash">—</span>`;
        return `<td class="link-cell links-cell" data-col="links">${inner}</td>`;
      }

      /** Brand glyphs for app stores, keyed by platform in apps.json `lastUpdated`. */
      const PLATFORM_ICON_SVG = Object.freeze({
        ios:
          '<svg class="platform-icon platform-icon--ios" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M16.365 1.43c0 1.14-.42 2.2-1.1 2.98-.83.95-2.19 1.69-3.32 1.6-.13-1.07.42-2.21 1.06-2.93.78-.86 2.16-1.55 3.36-1.65zM20.5 17.2c-.55 1.27-.82 1.84-1.53 2.96-1 1.57-2.4 3.52-4.14 3.53-1.55.02-1.95-1.01-4.05-1-2.1.01-2.54 1.02-4.09 1.01-1.74-.02-3.07-1.78-4.07-3.35C-.05 17.5-.36 12.6 1.31 10.18c1.06-1.55 2.74-2.46 4.32-2.46 1.61 0 2.62 1.06 3.95 1.06 1.29 0 2.07-1.06 3.93-1.06 1.41 0 2.9.77 3.96 2.1-3.48 1.9-2.9 6.87.03 7.38z"/></svg>',
        android:
          '<svg class="platform-icon platform-icon--android" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85a.637.637 0 0 0-.83.22l-1.88 3.24a11.43 11.43 0 0 0-8.94 0L5.65 5.67a.643.643 0 0 0-.87-.2c-.28.18-.37.54-.22.83L6.4 9.48A10.78 10.78 0 0 0 1 18h22a10.78 10.78 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg>',
      });

      const PLATFORM_LABELS = Object.freeze({ ios: "App Store", android: "Google Play" });

      /** Last Updated column: per-platform store-upload date with the Apple/Android glyph (apps.json `lastUpdated`). */
      function lastUpdatedCell(app) {
        const lu = app?.lastUpdated;
        const order = ["ios", "android"];
        const lines = [];
        if (lu && typeof lu === "object") {
          order.forEach((platform) => {
            const iso = typeof lu[platform] === "string" ? lu[platform].trim() : "";
            const disp = formatIsoDateMedium(iso);
            if (!disp) return;
            const icon = PLATFORM_ICON_SVG[platform] || "";
            const label = PLATFORM_LABELS[platform] || platform;
            lines.push(
              `<p class="last-updated-line" title="${esc(label + " — " + disp)}">${icon}<span>${esc(disp)}</span></p>`
            );
          });
        }
        const inner = lines.length
          ? `<div class="last-updated-stack">${lines.join("")}</div>`
          : `<span class="dash">—</span>`;
        return `<td class="last-updated-cell">${inner}</td>`;
      }

      /** Small pill under app name from apps.json `lifecycle`: new | active | live | revenue (case-insensitive). */
      function lifecyclePillMarkup(app) {
        const raw = String(app.lifecycle ?? app.bucket ?? "").trim().toLowerCase();
        const pills = {
          new: ["lifecycle-pill--new", "🌱 sprout"],
          active: ["lifecycle-pill--active", "🌿 growing"],
          live: ["lifecycle-pill--limb", "🍇 fruitful"],
          revenue: ["lifecycle-pill--limb", "🍇 fruitful"],
        };
        const spec = pills[raw];
        if (!spec) return "";
        const [cls, label] = spec;
        return `<span class="lifecycle-pill ${cls}">${label}</span>`;
      }

      function lifecycleKey(app) {
        const raw = String(app.lifecycle ?? app.bucket ?? "").trim().toLowerCase();
        return ["new", "active", "live", "revenue"].includes(raw) ? raw : "unknown";
      }

      function normalizeAppsPayload(data) {
        const raw = data ?? {};
        const apps = Array.isArray(raw.apps)
          ? raw.apps
          : Array.isArray(raw.projects)
            ? raw.projects
            : [];
        return { apps };
      }

      function renderAppsTable(apps, emptyMessage = "No apps in apps.json.") {
        const rows = Array.isArray(apps) ? apps : [];
        if (!rows.length) {
          const span = visibleTableColSpan();
          appsBody.innerHTML = `<tr><td colspan="${span}"><span class="dash">${esc(emptyMessage)}</span></td></tr>`;
          applyColumnVisibility();
          return;
        }
        appsBody.innerHTML = rows
          .map((app) => {
            const name = app.appName ?? app.name ?? app.title ?? "";
            const keyRaw = appKey(app) || String(name);
            const keyAttr = esc(keyRaw);
            const rowTodoText = rowTodosByApp[keyRaw] ?? "";
            const savedHeight = rowTodoHeightsByApp[keyRaw];
            const rowTodoHeightStyle =
              typeof savedHeight === "number" && savedHeight > 0
                ? ` style="height:${savedHeight}px"`
                : "";
            const rowTodoPlaceholder =
              "Start with 1. then Enter → 2. 3. …  (Shift+Enter = plain newline)\nMix with - [ ] tasks anytime.";
            const rowTodoTitle =
              "Numbered list: end a line with 1. text then Enter for the next number. Shift+Enter skips numbering. Checklists - [ ] / - [x] still work. Saved to dashboard/pm-dashboard-row-todos.json when node dashboard/server.mjs runs; localStorage mirrors.";
            const lifePill = lifecyclePillMarkup(app);
            return `<tr draggable="false" class="app-row" data-app-key="${keyAttr}">
              <td class="drag-col" title="Drag to reorder" aria-hidden="true">⋮⋮</td>
              <td class="app"><div class="app-name-stack"><span class="app-name">${esc(name)}</span>${lifePill}</div></td>
              ${lastUpdatedCell(app)}
              ${linksCell(app)}
              <td class="row-todos-cell">
                <textarea
                  class="row-todos-textarea"
                  rows="5"
                  data-row-todos-key="${keyAttr}"${rowTodoHeightStyle}
                  placeholder="${esc(rowTodoPlaceholder)}"
                  title="${esc(rowTodoTitle)}"
                  spellcheck="true"
                  aria-label="${esc("Todos scratchpad for " + name)}"
                >${esc(rowTodoText)}</textarea>
              </td>
              ${tldrSummaryCell(app)}
              ${app?.conversation ? conversationLaneCell(app, "build", "build-cell", "build") : buildCell(app)}
              ${app?.conversation ? conversationLaneCell(app, "marketing", "marketing-cell", "marketing", "mauMonthly") : marketingCell(app)}
              ${app?.conversation ? conversationLaneCell(app, "revenue", "revenue-cell", "revenue", "revenueMonthly") : linkCell(app.revenue, "Open", "revenue-cell", true, "revenue")}
            </tr>`;
          })
          .join("");
        appsBody.querySelectorAll("a").forEach((a) => a.setAttribute("draggable", "false"));
        applyColumnVisibility();
        observeRowTodoHeights();
      }

      function showError(message) {
        errorBanner.textContent = message;
        errorBanner.hidden = false;
      }

      function clearError() {
        errorBanner.textContent = "";
        errorBanner.hidden = true;
      }

      function readSelectedStatusesFromUi() {
        const activeStatuses = Array.from(
          statusFilterList.querySelectorAll(".status-filter-btn.is-active")
        )
          .flatMap((el) => (el.dataset.status || "").split(/\s+/))
          .filter(Boolean);
        selectedStatuses = new Set(activeStatuses);
      }

      function applyStatusFilterAndRender() {
        const total = appsOrderedSnapshot.length;
        const filtered = appsOrderedSnapshot.filter((app) =>
          selectedStatuses.has(lifecycleKey(app))
        );
        if (!total) {
          filterStatusText.textContent = "";
          renderAppsTable([]);
          return;
        }
        if (!selectedStatuses.size) {
          filterStatusText.textContent = "No statuses selected.";
          renderAppsTable([], "No apps match current filters.");
          return;
        }
        filterStatusText.textContent = `Showing ${filtered.length} of ${total} apps`;
        renderAppsTable(filtered, "No apps match current filters.");
      }

      let dragSortHandlersBound = false;

      /** Row currently armed for dragging via the ⋮⋮ handle (mousedown enables `draggable`). */
      let armedDragRow = null;

      function disarmDragRow() {
        if (armedDragRow) {
          armedDragRow.draggable = false;
          armedDragRow = null;
        }
      }

      /** HTML5 drag/drop reorder; persists `appOrderStorageKey`. */
      function bindDragReorderHandlers() {
        if (dragSortHandlersBound) return;
        dragSortHandlersBound = true;

        // Only arm a row for dragging when the press starts on the ⋮⋮ handle,
        // so click-dragging to highlight text in other cells stays a selection.
        appsBody.addEventListener("mousedown", (e) => {
          disarmDragRow();
          if (!e.target.closest?.("td.drag-col")) return;
          const tr = e.target.closest?.("tr.app-row");
          if (!tr || !appsBody.contains(tr)) return;
          tr.draggable = true;
          armedDragRow = tr;
        });

        document.addEventListener("mouseup", () => {
          // Drag never started (plain click on handle); release the arm.
          if (armedDragRow && !armedDragRow.classList.contains("drag-active")) {
            disarmDragRow();
          }
        });

        appsBody.addEventListener("dragstart", (e) => {
          const tr = e.target.closest?.("tr.app-row");
          if (!tr || !appsBody.contains(tr) || tr !== armedDragRow) {
            e.preventDefault();
            return;
          }
          const key = tr.dataset.appKey || "";
          if (!key) {
            e.preventDefault();
            return;
          }
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", key);
          tr.classList.add("drag-active");
        });

        appsBody.addEventListener("dragend", () => {
          appsBody
            .querySelectorAll("tr.app-row.drag-active, tr.app-row.drag-over")
            .forEach((r) =>
              r.classList.remove("drag-active", "drag-over")
            );
          disarmDragRow();
        });

        appsBody.addEventListener("dragover", (e) => {
          const tr = e.target.closest?.("tr.app-row");
          e.preventDefault();
          if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
          appsBody
            .querySelectorAll("tr.app-row.drag-over")
            .forEach((r) => r.classList.remove("drag-over"));
          if (tr && appsBody.contains(tr)) tr.classList.add("drag-over");
        });

        appsBody.addEventListener("drop", (e) => {
          const tr = e.target.closest?.("tr.app-row");
          e.preventDefault();
          appsBody
            .querySelectorAll("tr.app-row.drag-over, tr.app-row.drag-active")
            .forEach((r) => r.classList.remove("drag-over", "drag-active"));
          const fromKey = e.dataTransfer.getData("text/plain");
          const beforeKey = tr?.dataset?.appKey;
          if (
            !fromKey ||
            !beforeKey ||
            fromKey === beforeKey ||
            !appsOrderedSnapshot.length
          ) {
            return;
          }
          const keys = appsOrderedSnapshot.map(appKey).filter(Boolean);
          if (!keys.includes(fromKey)) return;
          const nextKeys = insertKeyBefore(keys, fromKey, beforeKey);
          writeStoredOrder(nextKeys);
          appsOrderedSnapshot = applyKeysOrderExactly(appsOrderedSnapshot, nextKeys);
          applyStatusFilterAndRender();
          refreshStatus.textContent =
            "App order saved locally (survives refresh).";
        });
      }

      /**
       * If the caret sits at the end of a `N. ` line, insert the next number on a
       * new line. Mutates the textarea value/caret in place. Returns true if handled.
       */
      function continueNumberedList(ta) {
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        if (start !== end) return false;
        const text = ta.value;
        const lineStart = text.lastIndexOf("\n", start - 1) + 1;
        const nextNl = text.indexOf("\n", start);
        const lineEndPos = nextNl === -1 ? text.length : nextNl;
        if (start !== lineEndPos) return false;
        const fullLine = text.slice(lineStart, lineEndPos);
        const m = fullLine.match(/^(\s*)(\d+)\.\s*(.*)$/);
        if (!m) return false;
        const indent = m[1];
        const n = parseInt(m[2], 10);
        if (!Number.isFinite(n)) return false;
        const insert = `\n${indent}${n + 1}. `;
        ta.value = text.slice(0, start) + insert + text.slice(start);
        const caret = start + insert.length;
        ta.selectionStart = ta.selectionEnd = caret;
        return true;
      }

      let rowTodosScratchSaveTimer = null;
      let rowTodosScratchHandlersBound = false;

      function readStoredAppRowTodos() {
        try {
          const raw = localStorage.getItem(pmDashboardRowTodosStorageKey);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return {};
          /** @type {Record<string, string>} */
          const out = {};
          for (const [k, v] of Object.entries(parsed)) {
            if (typeof k === "string" && typeof v === "string") out[k] = v;
          }
          return out;
        } catch {
          return {};
        }
      }

      function writeStoredAppRowTodos(obj) {
        try {
          localStorage.setItem(pmDashboardRowTodosStorageKey, JSON.stringify(obj));
          return true;
        } catch {
          return false;
        }
      }

      function readStoredRowTodoHeights() {
        try {
          const raw = localStorage.getItem(pmDashboardRowTodoHeightsStorageKey);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return {};
          /** @type {Record<string, number>} */
          const out = {};
          for (const [k, v] of Object.entries(parsed)) {
            if (typeof k === "string" && typeof v === "number" && v > 0) out[k] = v;
          }
          return out;
        } catch {
          return {};
        }
      }

      function writeStoredRowTodoHeights(obj) {
        try {
          localStorage.setItem(
            pmDashboardRowTodoHeightsStorageKey,
            JSON.stringify(obj)
          );
        } catch {
          /* storage may be unavailable; height is a non-critical preference */
        }
      }

      /** Tracks the last-seen height per textarea so the initial measure isn't saved as a user resize. */
      const rowTodoHeightBaseline = new WeakMap();
      let rowTodoHeightSaveTimer = null;
      const rowTodoHeightObserver =
        typeof ResizeObserver === "function"
          ? new ResizeObserver((entries) => {
              let changed = false;
              for (const entry of entries) {
                const ta = entry.target;
                const key = ta.dataset.rowTodosKey;
                if (!key) continue;
                const h = Math.round(ta.getBoundingClientRect().height);
                if (!h) continue;
                if (!rowTodoHeightBaseline.has(ta)) {
                  rowTodoHeightBaseline.set(ta, h);
                  continue;
                }
                if (Math.abs(h - rowTodoHeightBaseline.get(ta)) < 1) continue;
                rowTodoHeightBaseline.set(ta, h);
                rowTodoHeightsByApp[key] = h;
                changed = true;
              }
              if (changed) {
                clearTimeout(rowTodoHeightSaveTimer);
                rowTodoHeightSaveTimer = setTimeout(
                  () => writeStoredRowTodoHeights(rowTodoHeightsByApp),
                  250
                );
              }
            })
          : null;

      /** Re-attach the resize observer to the current set of Todos textareas after a render. */
      function observeRowTodoHeights() {
        if (!rowTodoHeightObserver) return;
        rowTodoHeightObserver.disconnect();
        appsBody
          .querySelectorAll("textarea.row-todos-textarea")
          .forEach((ta) => rowTodoHeightObserver.observe(ta));
      }

      /** @returns {Promise<void>} */
      async function persistAppRowTodosToServer(obj) {
        if (!window.location.protocol.startsWith("http")) {
          writeStoredAppRowTodos(obj);
          return;
        }
        try {
          const res = await fetch("/api/dashboard-row-todos", {
            method: "PUT",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({ rows: obj }),
          });
          writeStoredAppRowTodos(obj);
          if (!res.ok) {
            /* kept browser copy above */
          }
        } catch {
          writeStoredAppRowTodos(obj);
        }
      }

      async function hydrateAppRowTodos() {
        const isHttp = window.location.protocol.startsWith("http");
        if (!isHttp) {
          rowTodosByApp = readStoredAppRowTodos();
          return;
        }
        try {
          const res = await fetch("/api/dashboard-row-todos", { cache: "no-store" });
          if (!res.ok) throw new Error(String(res.status));
          const data = await res.json();
          /** @type {Record<string, string>} */
          let serverRows = {};
          if (data && typeof data.rows === "object" && data.rows !== null) {
            for (const [k, v] of Object.entries(data.rows)) {
              if (typeof k === "string" && typeof v === "string") serverRows[k] = v;
            }
          }
          const local = readStoredAppRowTodos();
          const serverEmpty = Object.keys(serverRows).length === 0;
          rowTodosByApp = { ...local, ...serverRows };
          if (serverEmpty && Object.keys(local).length > 0) {
            await persistAppRowTodosToServer(rowTodosByApp);
          }
          writeStoredAppRowTodos(rowTodosByApp);
        } catch {
          rowTodosByApp = readStoredAppRowTodos();
        }
      }

      async function hydrateConversationFiles() {
        if (!window.location.protocol.startsWith("http")) {
          conversationFilesLoaded = false;
          return;
        }
        try {
          const res = await fetch("/api/conversation-files", { cache: "no-store" });
          if (!res.ok) throw new Error(String(res.status));
          const data = await res.json();
          conversationFilesByLimb =
            data && typeof data.limbs === "object" && data.limbs !== null
              ? data.limbs
              : {};
          conversationFilesLoaded = true;
        } catch {
          conversationFilesByLimb = {};
          conversationFilesLoaded = false;
        }
      }

      function bindAppRowTodosSave() {
        if (rowTodosScratchHandlersBound) return;
        rowTodosScratchHandlersBound = true;

        function scheduleRowTodosPersist(ta) {
          const k = ta.dataset.rowTodosKey;
          if (!k) return;
          rowTodosByApp[k] = ta.value;
          clearTimeout(rowTodosScratchSaveTimer);
          rowTodosScratchSaveTimer = setTimeout(() => {
            void persistAppRowTodosToServer(rowTodosByApp);
          }, 250);
        }

        appsBody.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" || e.shiftKey) return;
          const ta = e.target.closest?.("textarea.row-todos-textarea");
          if (!ta || !appsBody.contains(ta)) return;
          if (!continueNumberedList(ta)) return;
          e.preventDefault();
          scheduleRowTodosPersist(ta);
        });

        appsBody.addEventListener("input", (e) => {
          const ta = e.target.closest?.("textarea.row-todos-textarea");
          if (!ta || !appsBody.contains(ta)) return;
          scheduleRowTodosPersist(ta);
        });
      }

      let notesSaveHintTimer = null;
      let notesInputBound = false;

      function readStoredNotes() {
        try {
          return localStorage.getItem(pmDashboardNotesStorageKey) ?? "";
        } catch {
          return "";
        }
      }

      function writeStoredNotes(text) {
        try {
          localStorage.setItem(pmDashboardNotesStorageKey, text);
          return true;
        } catch {
          return false;
        }
      }

      /** @returns {"disk"|"browser"|false} */
      async function persistNotesToServer(text) {
        if (!window.location.protocol.startsWith("http")) {
          return writeStoredNotes(text) ? "browser" : false;
        }
        try {
          const res = await fetch("/api/dashboard-notes", {
            method: "PUT",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({ text }),
          });
          writeStoredNotes(text);
          return res.ok ? "disk" : "browser";
        } catch {
          writeStoredNotes(text);
          return "browser";
        }
      }

      /** Apply any saved height to the Notes textarea and persist future resizes (localStorage only). */
      function bindNotesHeightPersistence() {
        if (!pmDashboardNotesEl) return;
        try {
          const raw = localStorage.getItem(pmDashboardNotesHeightStorageKey);
          const saved = raw ? Number(raw) : 0;
          if (Number.isFinite(saved) && saved > 0) {
            pmDashboardNotesEl.style.height = `${saved}px`;
          }
        } catch {
          /* ignore */
        }
        if (typeof ResizeObserver !== "function") return;
        let baseline = null;
        let saveTimer = null;
        const ro = new ResizeObserver(() => {
          const h = Math.round(pmDashboardNotesEl.getBoundingClientRect().height);
          if (!h) return;
          if (baseline === null) {
            baseline = h;
            return;
          }
          if (Math.abs(h - baseline) < 1) return;
          baseline = h;
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            try {
              localStorage.setItem(pmDashboardNotesHeightStorageKey, String(h));
            } catch {
              /* height is a non-critical preference */
            }
          }, 250);
        });
        ro.observe(pmDashboardNotesEl);
      }

      function bindPmDashboardNotesSave() {
        if (!pmDashboardNotesEl || notesInputBound) return;
        notesInputBound = true;
        bindNotesHeightPersistence();
        let debounceTimer = null;
        pmDashboardNotesEl.addEventListener("input", () => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(async () => {
            const text = pmDashboardNotesEl.value;
            const where = await persistNotesToServer(text);
            if (notesSaveHintEl) {
              let msg = "";
              if (where === "disk") msg = "Saved to disk";
              else if (where === "browser") msg = "Saved in browser only";
              else msg = "Could not save";
              notesSaveHintEl.textContent = msg;
              clearTimeout(notesSaveHintTimer);
              notesSaveHintTimer = setTimeout(() => {
                notesSaveHintEl.textContent = "";
              }, 1600);
            }
          }, 250);
        });
      }

      async function hydratePmDashboardNotes() {
        if (!pmDashboardNotesEl) return;
        const isHttp = window.location.protocol.startsWith("http");
        if (!isHttp) {
          pmDashboardNotesEl.value = readStoredNotes();
          bindPmDashboardNotesSave();
          return;
        }
        try {
          const res = await fetch("/api/dashboard-notes", { cache: "no-store" });
          if (!res.ok) throw new Error(String(res.status));
          const data = await res.json();
          let serverText = typeof data.text === "string" ? data.text : "";
          const local = readStoredNotes();
          if (serverText === "" && local !== "") {
            await persistNotesToServer(local);
            serverText = local;
          }
          pmDashboardNotesEl.value = serverText;
          writeStoredNotes(serverText);
        } catch {
          pmDashboardNotesEl.value = readStoredNotes();
        }
        bindPmDashboardNotesSave();
      }

      async function loadDashboard() {
        clearError();
        const isServed = window.location.protocol.startsWith("http");
        if (!isServed) {
          showError(
            "Open this page via the dashboard server (node dashboard/server.mjs from the trunk repo root) so /apps.json can load. file:// will not work."
          );
          appsBody.innerHTML = `<tr><td colspan="${visibleTableColSpan()}"><span class="dash">—</span></td></tr>`;
          applyColumnVisibility();
          return;
        }

        refreshStatus.textContent = "Loading…";
        try {
          const [res] = await Promise.all([
            fetch("/apps.json", { cache: "no-store" }),
            hydrateAppRowTodos(),
            hydrateConversationFiles(),
          ]);
          if (!res.ok) throw new Error(`HTTP ${res.status} loading apps.json`);
          let data;
          try {
            data = await res.json();
          } catch {
            throw new Error("apps.json is not valid JSON.");
          }
          const normalized = normalizeAppsPayload(data);
          const fromJson = normalized.apps.slice();
          const canonKeys = fromJson.map(appKey).filter(Boolean);
          const mergedKeys = mergeCanonicalOrder(canonKeys, readStoredOrder());
          appsOrderedSnapshot = applyKeysOrderExactly(fromJson, mergedKeys);
          applyStatusFilterAndRender();
          refreshStatus.textContent =
            localStorage.getItem(appOrderStorageKey) != null
              ? "Loaded from apps.json (custom app order)."
              : "Loaded from apps.json.";
        } catch (err) {
          const msg =
            err instanceof Error ? err.message : "Failed to load apps.json.";
          showError(msg);
          appsBody.innerHTML = `<tr><td colspan="${visibleTableColSpan()}"><span class="dash">Could not load data.</span></td></tr>`;
          applyColumnVisibility();
          refreshStatus.textContent = "";
        }
      }

      bindDragReorderHandlers();
      bindColumnResizeHandlers();
      bindAppRowTodosSave();
      rowTodoHeightsByApp = readStoredRowTodoHeights();

      columnWidths = readColumnWidths();
      applyColumnWidthsToCols();

      columnVisibility = readColumnVisibility();
      syncCheckboxesFromColumnVisibility();
      applyColumnVisibility();

      columnChecklistEl?.addEventListener("change", (e) => {
        const inp = e.target.closest?.("[data-col-toggle]");
        if (!inp || !(inp instanceof HTMLInputElement)) return;
        const k = inp.dataset.colToggle || "";
        if (!optionalColumnKeys.includes(k)) return;
        columnVisibility[k] = inp.checked;
        writeColumnVisibility();
        applyColumnVisibility();
      });

      statusFilterList.addEventListener("click", (e) => {
        const btn = e.target.closest?.(".status-filter-btn");
        if (!btn || !statusFilterList.contains(btn)) return;
        const buttons = Array.from(
          statusFilterList.querySelectorAll(".status-filter-btn")
        );
        const activeButtons = buttons.filter((b) =>
          b.classList.contains("is-active")
        );
        const allWereActive = activeButtons.length === buttons.length;

        if (allWereActive) {
          buttons.forEach((b) => {
            const shouldBeActive = b === btn;
            b.classList.toggle("is-active", shouldBeActive);
            b.setAttribute("aria-pressed", shouldBeActive ? "true" : "false");
          });
        } else {
          btn.classList.toggle("is-active");
          btn.setAttribute(
            "aria-pressed",
            btn.classList.contains("is-active") ? "true" : "false"
          );
          const nowActiveButtons = buttons.filter((b) =>
            b.classList.contains("is-active")
          );
          if (!nowActiveButtons.length) {
            buttons.forEach((b) => {
              b.classList.add("is-active");
              b.setAttribute("aria-pressed", "true");
            });
          }
        }
        readSelectedStatusesFromUi();
        applyStatusFilterAndRender();
      });
      themeSelect.addEventListener("change", () => {
        const selected = themeSelect.value;
        if (window.PmDashboardTheme) {
          window.PmDashboardTheme.apply(selected);
          try {
            localStorage.setItem(window.PmDashboardTheme.STORAGE_KEY, selected);
          } catch {
            /* ignore */
          }
          window.PmDashboardTheme.broadcastThemeChange(selected);
        }
      });

      const savedTheme = window.PmDashboardTheme
        ? window.PmDashboardTheme.readStoredThemeId()
        : "slides";
      if (window.PmDashboardTheme?.themes[savedTheme]) {
        themeSelect.value = savedTheme;
      }
      window.PmDashboardTheme?.apply(themeSelect.value);
      readSelectedStatusesFromUi();
      void hydratePmDashboardNotes();
      loadDashboard();
    </script>
  </body>
</html>
