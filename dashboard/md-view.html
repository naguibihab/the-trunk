<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --text: #c9d1d9;
        --muted: #8b949e;
        --line: #30363d;
        --primary: #58a6ff;
        --code-bg: #1b2230;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(6px);
      }
      .topbar .path {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        direction: rtl;
        text-align: left;
      }
      .topbar a {
        flex-shrink: 0;
        color: var(--text);
        text-decoration: none;
        font-size: 0.82rem;
        padding: 5px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
      }
      .topbar a:hover {
        border-color: color-mix(in srgb, var(--primary) 45%, var(--line));
        background: color-mix(in srgb, var(--primary) 15%, var(--panel));
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 28px 24px 80px;
      }
      .md :first-child { margin-top: 0; }
      .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
        line-height: 1.25;
        margin: 1.6em 0 0.6em;
      }
      .md h1, .md h2 {
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--line);
      }
      .md h1 { font-size: 1.8rem; }
      .md h2 { font-size: 1.45rem; }
      .md h3 { font-size: 1.2rem; }
      .md a { color: var(--primary); }
      .md code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.86em;
        background: var(--code-bg);
        padding: 0.15em 0.4em;
        border-radius: 5px;
      }
      .md pre {
        background: var(--code-bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 16px;
        overflow: auto;
      }
      .md pre code { background: none; padding: 0; font-size: 0.82rem; }
      .md blockquote {
        margin: 1em 0;
        padding: 0.3em 1em;
        color: var(--muted);
        border-left: 3px solid var(--line);
      }
      .md table {
        border-collapse: collapse;
        width: 100%;
        margin: 1em 0;
        font-size: 0.92rem;
      }
      .md th, .md td {
        border: 1px solid var(--line);
        padding: 7px 12px;
        text-align: left;
      }
      .md th { background: var(--panel); }
      .md tr:nth-child(2n) td { background: color-mix(in srgb, var(--panel) 50%, transparent); }
      .md img { max-width: 100%; }
      .md hr { border: none; border-top: 1px solid var(--line); margin: 1.8em 0; }
      .md ul, .md ol { padding-left: 1.6em; }
      .md li + li { margin-top: 0.25em; }
      .md input[type="checkbox"] { margin-right: 0.5em; }
      .state {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 24px 0;
      }
      .state.error { color: #ffa198; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a href="/" title="Back to dashboard">← Dashboard</a>
      <span class="path" id="filePath" dir="ltr"></span>
      <a id="rawLink" href="#" title="View raw Markdown">Raw</a>
    </div>
    <main>
      <div id="status" class="state">Loading…</div>
      <article id="content" class="md" hidden></article>
    </main>
    <script src="/marked.min.js"></script>
    <script>
      (function () {
        const statusEl = document.getElementById("status");
        const contentEl = document.getElementById("content");
        const filePathEl = document.getElementById("filePath");
        const rawLink = document.getElementById("rawLink");

        const filePath = decodeURIComponent(window.location.pathname);
        const rawUrl = window.location.pathname + "?raw=1";
        filePathEl.textContent = filePath;
        filePathEl.title = filePath;
        rawLink.href = rawUrl;
        document.title = filePath.split("/").pop() + " — preview";

        function showError(msg) {
          statusEl.className = "state error";
          statusEl.textContent = msg;
        }

        fetch(rawUrl, { cache: "no-store" })
          .then((res) => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          })
          .then((text) => {
            if (typeof marked === "undefined") {
              throw new Error("Markdown renderer failed to load (/marked.min.js).");
            }
            marked.setOptions({ gfm: true, breaks: false });
            contentEl.innerHTML = marked.parse(text);
            contentEl.querySelectorAll('a[href^="http"]').forEach((a) => {
              a.target = "_blank";
              a.rel = "noopener noreferrer";
            });
            statusEl.hidden = true;
            contentEl.hidden = false;
          })
          .catch((err) => {
            showError("Could not load Markdown: " + (err && err.message ? err.message : err));
          });
      })();
    </script>
  </body>
</html>
